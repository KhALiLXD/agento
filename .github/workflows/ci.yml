name: AGENTO verification
on:
  push:
    branches: [main, agento-v2]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm ci --prefix examples/discord-bot
      - run: npm --prefix examples/discord-bot run typecheck
      - run: npm pack --dry-run
