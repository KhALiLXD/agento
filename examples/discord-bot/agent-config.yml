# AGENTO v2 — salon customer assistant
# URLs are rewritten by examples/shared/config.mjs when AGENTO_API_BASE_URL is set.
# AGENTO_TIMEZONE overrides assistant.timezone at runtime.
version: "2"

assistant:
  name: Rozy
  language: auto
  timezone: UTC
  system_prompt: |
    أنتِ روزي، مساعدة استقبال لصالون نسائي.
    تحدثي بود واحترام وبصيغة المؤنث، وبنفس لغة العميلة قدر الإمكان.
    كوني مختصرة وواضحة، ولا تكرري الترحيب أو تدفعي كل محادثة نحو الحجز.

    قواعد ثابتة:
    - معلومات الخدمات والأسعار والمدد والموظفات والمواعيد تأتي من الأدوات فقط.
    - اسم خدمة تذكره العميلة ليس إثباتًا أن الخدمة موجودة؛ يجب التحقق منه من الكتالوج.
    - لا تختلقي IDs أو slot tokens أو أسعارًا أو مواعيد.
    - لا تطلبي من العميلة IDs أو tokens أو بيانات داخلية.
    - الحجز الحالي لخدمة واحدة في كل مرة.
    - لا تقولي إن الحجز تم إلا بعد نجاح أداة الحجز.
    - اختيار موعد لا يعني تنفيذ الحجز؛ التنفيذ يحتاج تأكيدًا صريحًا.
  conversation:
    enabled: true
    include_capability_summary: true
    use_presentation_model: true

models:
  routing:
    provider: openai
    model: gpt-5.6-luna
    api_key: $ENV:OPENAI_API_KEY
    temperature: 0
  presentation:
    provider: openai
    model: gpt-5.6-luna
    api_key: $ENV:OPENAI_API_KEY
    temperature: 0.3

routing:
  candidate_limit: 5
  fallback_attempts: 2
  lexical:
    enabled: true
    min_score: 1
    normalize_unicode: true
    normalize_arabic: true
    phrase_matching: true
  semantic_recall:
    enabled: true
    candidate_limit: 5
    max_catalog_tools: 50
    max_catalog_chars: 50000

session:
  ttl_ms: 1800000
  max_history_messages: 20
  max_sessions: 10000
  max_steps: 24

rate_limits:
  ai_calls: 60
  tool_calls: 120
  messages: 120
  messages_per_session: 500
  window_ms: 60000

tools:
  # ---------------------------------------------------------------------------
  # DISCOVERY FLOW
  # Generic browsing: categories -> groups -> services -> service details.
  # ---------------------------------------------------------------------------

  - id: get-categories
    tool:
      title: Browse Salon Categories
      description: >-
        Use only when the user wants to browse the salon generally without naming
        a specific service or asking to schedule an appointment.
      input_schema:
        type: object
        properties: {}
        additionalProperties: false
    trigger_hints:
      - what do you offer
      - show me your categories
      - what service categories do you have
      - browse services
      - شو عندكم
      - شو الأقسام
      - ورجيني أقسام الخدمات
      - بدي أشوف خدماتكم
    request:
      method: GET
      url: http://localhost:3000/api/catalog/categories
      timeout_ms: 8000
    response:
      instructions: >-
        Briefly introduce the available salon categories. The host renders the
        choices; ask the user to choose one.
    selection:
      items_path: $
      id_path: $.id
      label_path: $.name_ar
    navigates_to:
      tool: get-groups
      map:
        $.slug: $.slug

  - id: get-groups
    tool:
      title: Continue Category Browsing
      description: >-
        Internal continuation after the user selects a catalog category.
        Do not select this tool directly from a new free-form user request.
      input_schema:
        type: object
        properties:
          slug:
            type: string
            minLength: 1
        required: [slug]
        additionalProperties: false
    trigger_hints: []
    request:
      method: GET
      url: http://localhost:3000/api/catalog/categories/{slug}/groups
      timeout_ms: 8000
      map:
        path:
          slug: $.slug
    response:
      instructions: >-
        Briefly introduce the groups in the selected category. The host renders
        the choices; ask the user to choose one.
    selection:
      items_path: $.groups
      id_path: $.id
      label_path: $.name_ar
    navigates_to:
      tool: get-services
      map:
        $.group_id: $.id

  - id: get-services
    tool:
      title: Continue Group Browsing
      description: >-
        Internal continuation after the user selects a service group.
        Do not select this tool directly from a new free-form user request.
      input_schema:
        type: object
        properties:
          group_id:
            anyOf:
              - type: integer
                minimum: 1
              - type: string
                minLength: 1
          page:
            type: integer
            minimum: 1
            default: 1
          limit:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        required: [group_id]
        additionalProperties: false
    trigger_hints: []
    request:
      method: GET
      url: http://localhost:3000/api/catalog/groups/{group_id}/services
      timeout_ms: 8000
      map:
        path:
          group_id: $.group_id
        query:
          page: $.page
          limit: $.limit
    response:
      instructions: >-
        Briefly introduce the services in the selected group. The host renders
        the service choices; ask the user to choose one for details.
    selection:
      items_path: $.services
      id_path: $.id
      label_path: $.name_ar
      facts:
        service: $.name_ar
    navigates_to:
      tool: get-service-details
      map:
        $.service_id: $.id

  # ---------------------------------------------------------------------------
  # SERVICE LOOKUP / INFORMATION
  # ---------------------------------------------------------------------------

  - id: search-services
    tool:
      title: Search Salon Services
      description: >-
        Use when the user wants to find or explore a specific service, treatment,
        body area, beauty need, or named service, but is not asking to book or
        check appointment times. Treat the user's words only as a search query;
        never assume the named service exists until the API returns it.
      input_schema:
        type: object
        properties:
          q:
            type: string
            minLength: 1
            description: >-
              The service name, treatment, keyword, body area, or beauty need
              stated by the user.
          limit:
            type: integer
            minimum: 1
            maximum: 30
            default: 10
        required: [q]
        additionalProperties: false
    trigger_hints:
      - search for a service
      - find a service
      - do you have hair coloring
      - services for damaged hair
      - hair services
      - nail services
      - عندكم صبغة
      - شو خدمات الشعر
      - مناكير
      - بدي مناكير
      - عندكم خدمة
      - بدي خدمة ل
    request:
      method: GET
      url: http://localhost:3000/api/catalog/services/search
      timeout_ms: 8000
      map:
        query:
          q: $.q
          limit: $.limit
    response:
      instructions: >-
        The host renders matching services. Ask the user to choose the intended
        service when more than one result is possible. Do not claim a service
        exists unless it is in the API result.
    selection:
      items_path: $.services
      id_path: $.id
      label_path: $.name_ar
      facts:
        service: $.name_ar
      match:
        input_path: $.q
        item_path: $.name_ar
    navigates_to:
      tool: get-service-details
      map:
        $.service_id: $.id

  - id: get-service-details
    tool:
      title: Service Details
      description: >-
        Use when the user asks about the price, duration, description, variants,
        or details of a specific service. If no trusted service_id is supplied
        by navigation, resolve the user's service words through search-services
        before reading details.
      input_schema:
        type: object
        properties:
          service_query:
            type: string
            minLength: 1
            description: The service name or phrase stated by the user.
          service_id:
            type: integer
            minimum: 1
        required: [service_id]
        additionalProperties: false
    trigger_hints:
      - tell me about this service
      - service details
      - price of
      - how much is
      - how long does it take
      - duration of
      - details of
      - كم سعر
      - كم مدتها
      - تفاصيل خدمة
      - احكيلي عن
    depends_on:
      - tool: search-services
        when: missing
        arguments:
          q: $.service_query
        select:
          items_path: $.services
          id_path: $.id
          label_path: $.name_ar
          facts:
            service: $.name_ar
          match:
            input_path: $.service_query
            item_path: $.name_ar
        map:
          $.service_id: $.id
        ttl_ms: 300000
    request:
      method: GET
      url: http://localhost:3000/api/catalog/services/{service_id}
      timeout_ms: 8000
      map:
        path:
          service_id: $.service_id
    response:
      instructions: >-
        Present only the returned service facts. Clearly distinguish base price
        and base duration from variant-specific price and duration. Preserve
        variant names exactly. If currency is absent, do not invent one.
      model_view:
        path: $.service
        include:
          - id
          - name_ar
          - description
          - base_price
          - base_duration_minutes
          - ServiceVariants

  - id: get-service-employees
    tool:
      title: Service Specialists
      description: >-
        Use only when the user asks who can perform a specific service. Resolve
        the service against the catalog first; never infer a service ID or an
        employee ID from names.
      input_schema:
        type: object
        properties:
          service_query:
            type: string
            minLength: 1
            description: The service name or phrase stated by the user.
          service_id:
            type: integer
            minimum: 1
        required: [service_id]
        additionalProperties: false
    trigger_hints:
      - who can do this service
      - who performs
      - which stylist
      - which specialist
      - مين بتعمل هاي الخدمة
      - مين المختصات
      - مين بعمل
    depends_on:
      - tool: search-services
        when: missing
        arguments:
          q: $.service_query
        select:
          items_path: $.services
          id_path: $.id
          label_path: $.name_ar
          match:
            input_path: $.service_query
            item_path: $.name_ar
        map:
          $.service_id: $.id
        ttl_ms: 300000
    request:
      method: GET
      url: http://localhost:3000/api/catalog/services/{service_id}/employees
      timeout_ms: 8000
      map:
        path:
          service_id: $.service_id
    response:
      instructions: >-
        Present only employees returned by the API for this service. Do not
        describe an employee as available at a time unless availability was
        checked separately.
      model_view:
        path: $.employees
        include:
          - id
          - name
          - role
          - is_active

  # ---------------------------------------------------------------------------
  # SCHEDULING FLOW
  #
  # New booking/availability requests MUST enter through
  # resolve-service-for-scheduling. It validates the service before the runtime
  # asks for date/variant/slot information.
  # ---------------------------------------------------------------------------

  - id: resolve-service-for-scheduling
    tool:
      title: Start Appointment Scheduling
      description: >-
        This is the entry point for every NEW request to book, reserve, schedule,
        or check appointment times for a named service. The user's service text
        is only a search query, never a trusted service ID. Search the real
        catalog first and let the user disambiguate if needed. Do not skip this
        validation by selecting load-schedule-slots or commit-selected-slot.
      input_schema:
        type: object
        properties:
          q:
            type: string
            minLength: 1
            description: >-
              The service name, treatment, or beauty service the user wants to
              schedule. Copy only the relevant service phrase from the user's
              request.
          date:
            type: string
            format: date
            description: Appointment date when the user explicitly supplied one.
          variant_query:
            type: string
            minLength: 1
            description: >-
              A variant name or option explicitly requested by the user, if any.
          notes:
            type: string
            maxLength: 2000
        required: [q]
        additionalProperties: false
    trigger_hints:
      - book an appointment for
      - I want to book
      - reserve a service
      - schedule an appointment
      - check availability for
      - available times for
      - appointment times for
      - بدي احجز
      - بدي أحجز
      - بدي موعد
      - بدي احجز خدمة
      - شو المواعيد لخدمة
      - متى في موعد لخدمة
      - في مواعيد لخدمة
    request:
      method: GET
      url: http://localhost:3000/api/catalog/services/search
      timeout_ms: 8000
      map:
        query:
          q: $.q
          limit:
            source: constant
            value: 10
    response:
      instructions: >-
        This step validates the requested service before scheduling. The host
        renders candidate services. Ask the user to choose the intended service
        if the search is not an exact unique match.
    selection:
      items_path: $.services
      id_path: $.id
      label_path: $.name_ar
      facts:
        service: $.name_ar
      match:
        input_path: $.q
        item_path: $.name_ar
    navigates_to:
      tool: load-schedule-slots
      arguments:
        date: $.date
        variant_query: $.variant_query
        notes: $.notes
      map:
        $.service_id: $.id

  - id: load-schedule-slots
    tool:
      title: Continue Scheduling With Selected Service
      description: >-
        Internal continuation after resolve-service-for-scheduling selected a
        real service. Never select this tool directly for a new free-form
        booking or availability request. It resolves the service variant, then
        reads available appointment slots.
      input_schema:
        type: object
        properties:
          service_id:
            type: integer
            minimum: 1
          date:
            type: string
            format: date
            description: Appointment date.
          variant_query:
            type: string
            minLength: 1
            description: Explicit variant preference from the user, if any.
          variant_id:
            type: integer
            minimum: 1
          notes:
            type: string
            maxLength: 2000
        required:
          - service_id
          - date
          - variant_id
        additionalProperties: false
    trigger_hints: []
    depends_on:
      - tool: get-service-details
        when: missing
        arguments:
          service_id: $.service_id
        select:
          items_path: $.service.ServiceVariants
          id_path: $.id
          label_path: $.name_ar
          facts:
            variant: $.name_ar
            price: $.price
            duration: $.duration_minutes
          match:
            input_path: $.variant_query
            item_path: $.name_ar
        map:
          $.variant_id: $.id
        ttl_ms: 120000
    request:
      method: GET
      url: http://localhost:3000/api/availability
      timeout_ms: 8000
      map:
        query:
          date: $.date
          variant_ids: $.variant_id
    response:
      instructions: >-
        Tell the user these are currently available times for the selected
        service and variant. Choosing a time continues to the booking review; it
        does not mean the booking is already confirmed.
      private_fields:
        - slot_token
      output_schema:
        type: object
        required: [slots]
        properties:
          slots:
            type: array
            items:
              type: object
              required:
                - slot_token
                - start_at
                - start_time
              properties:
                slot_token:
                  type: string
                  minLength: 1
                start_at:
                  type: string
                  format: date-time
                start_time:
                  type: string
                  pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
    selection:
      items_path: $.slots
      id_path: $.slot_token
      id_sensitive: true
      label_path: $.start_time
      facts:
        appointment_time: $.start_at
        local_time: $.start_time
    navigates_to:
      tool: commit-selected-slot
      arguments:
        service_id: $.service_id
        date: $.date
        variant_id: $.variant_id
        notes: $.notes
      map:
        $.slot_token: $.slot_token

  - id: commit-selected-slot
    tool:
      title: Finalize Selected Appointment Slot
      description: >-
        Internal continuation only after the runtime has received a slot_token
        from load-schedule-slots. Never select this tool for an initial booking
        request, and never invent or accept a user-written slot token.
      input_schema:
        type: object
        properties:
          slot_token:
            type: string
            minLength: 1
          service_id:
            type: integer
            minimum: 1
          date:
            type: string
            format: date
          variant_id:
            type: integer
            minimum: 1
          notes:
            type: string
            maxLength: 2000
        required:
          - slot_token
        additionalProperties: false
    trigger_hints: []
    depends_on:
      - tool: load-schedule-slots
        when: missing
        arguments:
          service_id: $.service_id
          date: $.date
          variant_id: $.variant_id
          notes: $.notes
        select:
          items_path: $.slots
          id_path: $.slot_token
          id_sensitive: true
          label_path: $.start_time
          facts:
            appointment_time: $.start_at
            local_time: $.start_time
        map:
          $.slot_token: $.slot_token
        ttl_ms: 120000
    behavior:
      effect: side-effect
      recovery:
        refresh_dependency: load-schedule-slots
        statuses: [409, 410]
      confirmation:
        required: true
        ttl_ms: 60000
        preview:
          service:
            source: selection
            path: $.service
          variant:
            source: selection
            path: $.variant
          price:
            source: selection
            path: $.price
          duration:
            source: selection
            path: $.duration
          date: $.date
          appointment_time:
            source: selection
            path: $.local_time
          notes: $.notes
    request:
      method: POST
      url: http://localhost:3000/api/bookings/from-availability
      timeout_ms: 12000
      auth:
        type: session
      retry:
        attempts: 1
      map:
        body:
          slot_token: $.slot_token
          notes: $.notes
    response:
      instructions: >-
        Report the booking as successful only when the API call succeeded.
        Present the returned confirmation facts concisely. Never expose internal
        tokens or transport details.

  # ---------------------------------------------------------------------------
  # ACCOUNT
  # ---------------------------------------------------------------------------

  - id: get-my-appointments
    tool:
      title: My Appointments
      description: >-
        Use when an authenticated customer asks to see their own upcoming
        appointments or bookings.
      input_schema:
        type: object
        properties:
          limit:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          offset:
            type: integer
            minimum: 0
            default: 0
        additionalProperties: false
    trigger_hints:
      - my appointments
      - my bookings
      - upcoming appointments
      - when is my appointment
      - حجوزاتي
      - مواعيدي
      - متى موعدي
      - ورجيني حجوزاتي
    request:
      method: GET
      url: http://localhost:3000/api/appointments
      timeout_ms: 8000
      auth:
        type: session
      map:
        query:
          limit: $.limit
          offset: $.offset
    response:
      instructions: >-
        Present only the authenticated customer's appointments returned by the
        API, with the most useful service/date/time/status information available.
