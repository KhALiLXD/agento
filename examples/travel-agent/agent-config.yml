version: "2"
models:
  routing:
    provider: openai
    model: gpt-4o-mini
    api_key: $ENV:OPENAI_API_KEY
    temperature: 0
  presentation:
    provider: openai
    model: gpt-4o-mini
    api_key: $ENV:OPENAI_API_KEY
    temperature: 0.2
routing:
  candidate_limit: 6
  fallback_attempts: 2
session:
  ttl_ms: 1800000
  max_history_messages: 20
  max_sessions: 10000
  max_steps: 24
rate_limits:
  ai_calls: 60
  tool_calls: 120
  messages: 120
  messages_per_session: 1000
  window_ms: 60000
tools:
  - id: search-flights
    tool:
      description: Search available flights by origin, destination and travel date.
      input_schema:
        type: object
        properties:
          origin:
            type: string
            minLength: 2
          destination:
            type: string
            minLength: 2
          departure_date:
            type: string
            format: date
          return_date:
            type: string
            format: date
          cabin_class:
            type: string
            enum:
              - economy
              - business
              - first
            default: economy
          adults:
            type: integer
            minimum: 1
            maximum: 9
            default: 1
        required:
          - origin
          - destination
          - departure_date
        additionalProperties: false
    trigger_hints:
      - search flights
      - find a flight
      - available flights
      - رحلات
      - طيران
    request:
      method: GET
      url: https://api.example.com/v1/flights/search
      auth:
        type: session
      map:
        query:
          origin: $.origin
          destination: $.destination
          departure_date: $.departure_date
          return_date: $.return_date
          cabin_class: $.cabin_class
          adults: $.adults
    response:
      instructions: Present only flights returned by the API, with identifiers, times, airline and price.
  - id: book-flight
    tool:
      description: Book a selected flight after the traveler explicitly approves the summary.
      input_schema:
        type: object
        properties:
          flight_id:
            type: string
            minLength: 1
          passenger_name:
            type: string
            minLength: 2
          passenger_email:
            type: string
            format: email
          seat_preference:
            type: string
            enum:
              - window
              - aisle
              - no-preference
            default: no-preference
          meal_preference:
            type: string
            enum:
              - standard
              - vegetarian
              - vegan
              - halal
              - kosher
            default: standard
          special_requests:
            type: string
            maxLength: 1000
        required:
          - flight_id
          - passenger_name
          - passenger_email
        additionalProperties: false
    trigger_hints:
      - book this flight
      - confirm flight
      - reserve my seat
      - احجز الرحلة
    behavior:
      effect: side-effect
      confirmation:
        required: true
        ttl_ms: 300000
    request:
      method: POST
      url: https://api.example.com/v1/bookings/flights
      auth:
        type: session
      retry:
        attempts: 1
      map:
        body:
          flight_id: $.flight_id
          passenger_name: $.passenger_name
          passenger_email: $.passenger_email
          seat_preference: $.seat_preference
          meal_preference: $.meal_preference
          special_requests: $.special_requests
          booking_channel:
            source: constant
            value: agento
    response:
      instructions: Present the booking reference and status exactly as returned by the API.
  - id: my-bookings
    tool:
      description: List the authenticated traveler's existing flight bookings.
      input_schema:
        type: object
        properties: {}
        additionalProperties: false
    trigger_hints:
      - my bookings
      - my flights
      - reservations
      - حجوزاتي
    request:
      method: GET
      url: https://api.example.com/v1/bookings/me
      auth:
        type: session
    response:
      instructions: Present only bookings returned by the authenticated API.
